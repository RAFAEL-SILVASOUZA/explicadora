services:
  explicadora:
    build: .
    container_name: explicadora
    ports:
      - "5003:3000"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: explicadora-db
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo
      POSTGRES_DB: estudo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5403:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudo"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16
    container_name: explicadora-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo
      POSTGRES_DB: estudo_test
    ports:
      - "5404:5432"

volumes:
  pgdata:
