services:
  explicadora:
    build: .
    container_name: explicadora
    ports:
      - "5003:3000"
    env_file: .env
    environment:
      # Sobrescreve o .env: dentro do container, localhost é o próprio container.
      # O .env mantém localhost:5403 para rodar a app no host (npm run dev).
      DATABASE_URL: postgres://estudo:estudo@postgres:5432/estudo
      # Dentro do container, 127.0.0.1 não é a máquina do host: o LLM local
      # (porta 1234) precisa ser alcançado via host.docker.internal.
      LLM_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: explicadora-db
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo
      POSTGRES_DB: estudo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5403:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudo"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16
    container_name: explicadora-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo
      POSTGRES_DB: estudo_test
    ports:
      - "5404:5432"

volumes:
  pgdata:
